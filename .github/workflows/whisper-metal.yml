# Compila whisper.cpp con Metal para Mac con Apple Silicon y lo publica como versión de este repo. Es el motor de
# transcripción de Ecocut en Mac: faster-whisper ahí no usa la placa. Un solo ejecutable (estático, con la librería
# de Metal adentro). Se corre a mano (Actions → whisper-metal → Run workflow) con la versión de whisper.cpp a compilar.
name: whisper-metal

on:
  workflow_dispatch:
    inputs:
      whisper:
        description: Versión de whisper.cpp (tag de ggml-org/whisper.cpp)
        required: true
        default: v1.9.5

permissions:
  contents: write

jobs:
  mac-metal:
    runs-on: macos-14
    env:
      NOMBRE: whisper-metal-mac-arm64-${{ inputs.whisper }}
    steps:
      - name: Bajar whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper }}

      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release -j 4 --target whisper-cli

      # Las máquinas de GitHub no tienen Metal: corre en el procesador. Alcanza para ver que arranca y escribe JSON.
      - name: Probar
        run: |
          bash ./models/download-ggml-model.sh tiny
          ./build/bin/whisper-cli -m models/ggml-tiny.bin -f samples/jfk.wav -ojf -of prueba
          test -s prueba.json
          otool -L build/bin/whisper-cli

      - name: Empaquetar
        run: |
          mkdir "$NOMBRE"
          cp build/bin/whisper-cli "$NOMBRE/"
          cp LICENSE "$NOMBRE/LICENSE-whisper.cpp.txt"
          codesign --force -s - "$NOMBRE/whisper-cli"
          (cd "$NOMBRE" && zip -X "../$NOMBRE.zip" *)
          shasum -a 256 "$NOMBRE.zip" | tee "$NOMBRE.zip.sha256"
          ls -l "$NOMBRE" "$NOMBRE.zip"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="whisper-metal-${{ inputs.whisper }}"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$NOMBRE.zip" "$NOMBRE.zip.sha256" --repo "${{ github.repository }}" --latest=false --title "whisper.cpp ${{ inputs.whisper }} con Metal (Mac Apple Silicon)" --notes "Compilado desde ggml-org/whisper.cpp ${{ inputs.whisper }} con -DGGML_METAL=ON, estático. Licencia MIT (LICENSE-whisper.cpp.txt). Lo usa Ecocut para transcribir en Mac."
